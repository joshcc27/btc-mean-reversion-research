[project]
name = "btc-trader"
version = "0.1.0"
description = "Intraday BTC/USDT breakout-reversal research sandbox"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.10.7",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — ruff format handles this
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["notebooks.*"]
ignore_errors = true

[dependency-groups]
dev = [
    "pytest==8.3.5",
]
