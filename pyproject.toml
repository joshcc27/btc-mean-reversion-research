[project]
name = "btc-mean-reversion-research"
version = "0.2.0"
description = "Test of a short-horizon mean-reversion signal on 5-minute BTC/USDT bars (2024) under transaction costs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib==3.10.7",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btc_research"]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "jupyter",
    "nbconvert",
    "ipykernel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long; ruff format handles this
]

[tool.ruff.lint.isort]
known-first-party = ["btc_research"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["notebooks.*"]
ignore_errors = true
